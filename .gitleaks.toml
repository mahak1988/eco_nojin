# gitleaks configuration for Eco Nojin
# Run: gitleaks detect --source . --config .gitleaks.toml --verbose

[general]
  title = "Eco Nojin gitleaks config"
  exit_code = 1

# Allowlist paths
[allowlist]
  paths = [
    "*.md",
    "*.txt",
    "*.example",
    "*.template",
    ".gitignore",
    "LICENSE",
    "README*",
    "CHANGELOG*",
    "CONTRIBUTING*",
    ".env.example",
    ".env.template",
    "contracts/.env.example",
    "apps/web/.env.example",
    "packages/**/*.json",
    "tests/**/*.py",
    "docs/**/*.md",
  ]
  regexes = [
    # Allow example/placeholder values
    '''(?i)(example|placeholder|your_|your-|change_me|changeme|dev-|test_|fake_|dummy_|sample_|xxx|yyy|zzz)''',
    # Allow known safe patterns
    '''(?i)sk-[a-zA-Z0-9]{32,}''',  # OpenAI-like keys in example files
  ]

# Custom rules for Eco Nojin specific patterns
[[rules]]
  id = "eco-nojin-private-key"
  description = "Ethereum/Polygon private key"
  regex = '''(?i)(PRIVATE_KEY|private_key)\s*[:=]\s*["']?(0x)?[a-fA-F0-9]{64}["']?'''
  tags = ["key", "crypto"]
  entropy = 4.5

[[rules]]
  id = "eco-nojin-jwt-secret"
  description = "JWT Secret Key"
  regex = '''(?i)(JWT_SECRET|SECRET_KEY|JWT_SECRET_KEY)\s*[:=]\s*["']?[a-zA-Z0-9\-_=]{32,}["']?'''
  tags = ["key", "jwt"]
  entropy = 4.0

[[rules]]
  id = "eco-nojin-groq-api-key"
