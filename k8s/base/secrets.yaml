apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: eco-nojin
type: Opaque
stringData:
  # These values should be set via External Secrets Operator or sealed-secrets
  # Do not commit actual values to git
  SECRET_KEY: "REPLACE_WITH_ACTUAL_SECRET_KEY"
  JWT_SECRET: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  DATABASE_URL: "postgresql://user:password@postgresql:5432/eco_nojin"
  REDIS_URL: "redis://:password@redis-master:6379/0"
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_WITH_SUPABASE_SERVICE_ROLE_KEY"
  SUPABASE_ANON_KEY: "REPLACE_WITH_SUPABASE_ANON_KEY"
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
  CDSE_CLIENT_ID: "REPLACE_WITH_CDSE_CLIENT_ID"
  CDSE_CLIENT_SECRET: "REPLACE_WITH_CDSE_CLIENT_SECRET"
  CDS_API_KEY: "REPLACE_WITH_CDS_API_KEY"
  ALCHEMY_API_KEY: "REPLACE_WITH_ALCHEMY_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: eco-nojin
type: Opaque
stringData:
  redis-password: "REPLACE_WITH_REDIS_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-auth
  namespace: eco-nojin
type: Opaque
stringData:
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"
  replication-password: "REPLACE_WITH_REPLICATION_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: eco-nojin
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "REPLACE_WITH_BASE64_DOCKER_CONFIG"
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-api-gateway
  namespace: eco-nojin
type: kubernetes.io/tls
data:
  tls.crt: "REPLACE_WITH_BASE64_CERT"
  tls.key: "REPLACE_WITH_BASE64_KEY"