apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eco-nojin

resources:
  - ../../base

commonLabels:
  environment: staging
  app.kubernetes.io/instance: eco-nojin-staging

patchesStrategicMerge:
  - staging-patch.yaml

images:
  - name: ghcr.io/eco-nojin/api-gateway
    newTag: staging-latest
  - name: ghcr.io/eco-nojin/frontend
    newTag: staging-latest

replicas:
  - name: api-gateway
    count: 2
  - name: frontend
    count: 2

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
      - CORS_ORIGINS='["https://staging-app.eco-nojin.org", "https://staging-api.eco-nojin.org"]'

vars:
  - name: REPLICAS
    objref:
      kind: Deployment
      name: api-gateway
      apiVersion: apps/v1
    fieldref:
      fieldpath: spec.replicas