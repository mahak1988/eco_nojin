apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eco-nojin

resources:
  - ../../base

commonLabels:
  environment: production
  app.kubernetes.io/instance: eco-nojin-production

patchesStrategicMerge:
  - production-patch.yaml

images:
  - name: ghcr.io/eco-nojin/api-gateway
    newTag: v1.0.0
  - name: ghcr.io/eco-nojin/frontend
    newTag: v1.0.0

replicas:
  - name: api-gateway
    count: 5
  - name: frontend
    count: 3

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - CORS_ORIGINS='["https://app.eco-nojin.org", "https://api.eco-nojin.org", "https://www.eco-nojin.org"]'