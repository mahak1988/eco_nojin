# pnpm workspace configuration
packages:
  - 'frontend'
  - 'services/*'

# این تنظیمات باید در workspace level باشد نه global
autoInstallPeers: true
strictPeerDependencies: false

# تنظیمات performance
preferFrozenLockfile: true

onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - prisma
  - msw
