# Pre-commit configuration for Eco Nojin
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  # gitleaks - secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: gitleaks secret detection
        entry: gitleaks detect --source . --config .gitleaks.toml --verbose
        language: system
        stages: [commit, push]
        verbose: true

  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
        stages: [commit]
      - id: ruff-format
        name: ruff format
        stages: [commit]

  # MyPy - Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy type check
        args: [--strict, --ignore-missing-imports]
        additional_dependencies: [pydantic, fastapi, sqlalchemy, numpy, pandas, xarray, xclim]
        stages: [commit]
        exclude: ^tests/

  # Bandit - Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: bandit security scan
        args: [-r, --skip, B101,B601, --exclude, tests/,.venv/,.git/,build/,dist/]
        stages: [commit]
        exclude: ^tests/

  # Detect-secrets - additional secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets scan
        args: [--baseline, .secrets.baseline]
        stages: [commit]

  # Trailing whitespace and end-of-file
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|txt|json|yaml|yml)$
      - id: end-of-file-fixer
        exclude: \.(md|txt|json|yaml|yml)$
      - id: check-yaml
        exclude: ^apps/web/
      - id: check-json
      - id: check-merge-conflict
      - id: debug-logger
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Frontend - Biome (replaces ESLint/Prettier)
  - repo: https://github.com/biomejs/biome
    rev: v1.9.4
    hooks:
      - id: biome-check
        name: biome lint and format
        files: ^apps/web/
        args: [--write, --files-ignore-unknown=true]
        stages: [commit]

  # Frontend - TypeScript type check
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript type check
        entry: bash -c 'cd apps/web && npx tsc --noEmit'
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true