<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04100b" />
    <title>آفلاین | اکو نوژین</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #04100b;
        color: #e6f2ea;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container { text-align: center; max-width: 420px; }
      .icon { font-size: 64px; margin-bottom: 24px; }
      h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; color: #fff; }
      p { color: #9fbfb0; line-height: 1.6; margin-bottom: 24px; }
      button {
        background: #2fb36b;
        color: #04100b;
        border: none;
        padding: 14px 28px;
        border-radius: 9999px;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #3dc77d; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>شما آفلاین هستید</h1>
      <p>
        محتوای ذخیره شده در دسترس است. برای بارگذاری داده‌های جدید، اتصال اینترنت برقرار کنید.
      </p>
      <button onclick="window.location.reload()">تلاش مجدد</button>
    </div>
  </body>
</html>
