  - id: no-content-security-policy
    path: services/api_gateway/security.py
    owner: D-7
    status: degraded
    reason: >-
      The mounted SecurityHeadersMiddleware declares no Content-Security-Policy, so
      the gateway sends no CSP at all. Found in phase 5 by GET
      /api/v1/security/status, which computes its status from the live middleware
      stack and reported degraded for exactly this reason. The only CSP in the
      repository lived in services/security/headers.py, which was never mounted
      and was removed in phase 5, when it was confirmed to have zero importers. A correct policy cannot be
      written without the frontend's asset origins, so this is registered rather
      than guessed.
    risk: high
    review_by: 2026-10-28
  - id: mixed-k-provenance-in-point-chain
    path: services/scientific_motors/chain_runner.py
    owner: D-4
    status: degraded
    reason: >-
      rusle_point computes LS from the registry's Foster/Nearing but is handed a K from
      soilgrids.rusle_k_factor, which is the Williams 1995 multiplicative form. The two K
      equations disagree by 6.811x for a loam, so the product mixes provenances. Nothing in
      the tree compares them, so the discrepancy was invisible. Standardising on Renard
      would move a reference site from 53.7 to 365.9 t/ha/yr and hit rusle_point's 60 t/ha/yr
      ceiling; standardising on Williams would drop the three Renard raster sites by 5-12x.
      Both are now registered separately with citations, so neither is silently replaced.
    risk: high
    review_by: 2026-10-28

  - id: mccool-ls-branch-discontinuity
    path: engine/land/erosion_risk.py
    owner: D-4
    status: degraded
    reason: >-
      The 9% grade branch of the McCool LS function steps by +46.4% at the switch. The two
      arms disagree because the low-slope arm uses 16.8*sin - 0.045*cos^2 where the
      published Wischmeier & Smith form uses 16.8*sin - 0.50; the latter is continuous to
      +0.78%. The branch is also keyed on grade percent but the switch happens at 5.14
      degrees, not 9. Found by comparing the two arms numerically. Fixing it changes erosion
      numbers, so it needs the RUSLE2 guide and a scientific decision, not a code edit.
    risk: high
    review_by: 2026-10-28

  - id: compliance-router-never-mounted
    path: services/api_gateway/routers/compliance.py
    owner: D-3
    status: not_implemented
    reason: >-
      The whole compliance surface - KYC/AML, greenwashing assessment, disclosure and the
      carbon credit bridge - is unreachable: the router declares prefix /api/v1/compliance
      and is not included in main.py, and that was already true at HEAD, so this is not a
      regression. Verified against the running app's OpenAPI schema: 497 paths, zero under
      that prefix. Phase 1 added admin-only authorisation to these 12 endpoints, which is
      correct for when it is mounted and irrelevant until then. Mounting needs a migration
      for the provenance tables and a decision on the bridge's on-chain dependency.
    risk: high
    review_by: 2026-10-28

