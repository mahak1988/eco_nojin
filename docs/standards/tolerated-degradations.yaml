# tolerations: مسیرهایی که نتیجه کامل نمی‌دهند
#
# هر سطر یعنی: «می‌دانیم این مسیر ناقص است، مالکش را دارد، و تاریخ بازنگری
# دارد.» فهرست برای S-HONEST (docs/standards/S-HONEST.md).
#
# این فهرست ابزار سرکوب نیست: هر سطر یک بدهی ثبت‌شده است. سطری که رفع شد
# باید حذف شود، نه اینکه تاریخش به‌روز شود.
#
# اقلامی که فاز ۱ (۲۰۲۶-۰۹-۲۸) پیاده‌سازی کرد باید از این فهرست خارج شوند.
# وضعیت فعلی پس از فاز ۱:
#   - backup: پیاده‌سازی واقعی (SQLite snapshot / pg_dump) → از فهرست خارج شد
#   - ledger.verify_chain: به NotImplementedError تبدیل شد → خارج شد
#   - ledger.post_entry / get_balance: به‌جای مقدار جعلی، استثنا → خارج شدند
#   - traceability.verify_integrity: همچنان TODO → باقی می‌ماند
#   - nlg fabricated evidence: همچنان TODO → باقی می‌ماند
#
# بازبینی فاز ۵ (۲۰۲۶-۰۹-۲۸): هر ۲۲ سطر در برابر کد امروز بررسی شد.
# نتیجه: هیچ سطری کاملاً برطرف نشده بود، پس چیزی حذف نشد. آنچه عوض شد
# دقتِ متن است — ۹ سطر باریک‌تر شدند چون ادعای فرعی‌شان دیگر درست نبود:
#   - map_engine/api/ در فاز ۴ حذف شد و pipelineها حالا واقعاً mount می‌شوند،
#     پس ادعای «unreachable» افتاد؛ خودِ fetcherها هنوز مصنوعی‌اند.
#   - compute_ndvi حالا بازهٔ تاریخ درخواستی را برمی‌گرداند (قبلاً ثابت بود).
#   - شمارش fallbackهای verra از ۸ به ۶ رسید.
#   - در jobs/service.py درج تکراری JobEvent رفع شد؛ NameError هنوز هست.
#   - شماره‌خط‌های ارجاعی چند سطر با کد فعلی هم‌راستا شد.
#
# آنچه این فهرست پوشش نمی‌دهد (کاندیدا، ثبت‌نشده — عمداً اضافه نشده چون
# مالک و سطح ریسکشان تأیید نشده): اسکنر G2 در services/ هنوز ۸۶ یافته
# می‌دهد و فقط ۳۱ مورد آن زیر نامِ همین فهرست می‌افتد. بدترین‌های
# ثبت‌نشده: services/two_factor.py:28 (verify_totp → False ثابت)،
# services/security/ssrf.py:55 (validate_url → True ثابت)،
# services/carbon/compliance/kyc_aml.py:263 (verify_kyc → True ثابت)،
# services/security/antibot.py:429 (check_solution → False ثابت)،
# services/telegram_bot/config.py:34 (validate → True ثابت)،
# services/marketplace/order_management.py:309 (confirm_order → False ثابت).

