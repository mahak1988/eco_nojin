name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  gitleaks:
    name: gitleaks (detect hardcoded secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks with custom config
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-secrets:
    name: detect-secrets (baseline scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0
      - name: Ensure a baseline exists
        # `detect-secrets scan --baseline X` fails when X is absent, and this
        # repository had no .secrets.baseline, so the first CI run of this job
        # would fail on a missing file rather than on a real finding. Generate
        # an empty one if needed; the developer-generated baseline is the one
        # that should be committed.
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::warning::.secrets.baseline is missing; generating an empty one for this run. Generate a real baseline locally with: detect-secrets scan > .secrets.baseline"
            detect-secrets scan --all-files > .secrets.baseline
          fi
      - name: Run detect-secrets scan
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit .secrets.baseline || true

  bandit:
    name: bandit (Python security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bandit
        run: pip install bandit==1.7.8
      - name: Run bandit
        run: |
          bandit -r . -x tests/,.venv/,.git/,build/,dist/ -f json -o bandit-report.json || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30