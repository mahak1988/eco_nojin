name: Eco Nojin Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-api:
    name: Generate API Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python scripts/check_version.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web generate:api
      - run: git diff --exit-code -- packages/api-client/src/generated.ts
      - run: node scripts/check-verified-claims.mjs
      - run: pnpm check:site-url

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: generate-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:site-url

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: generate-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # Headroom for test workers; SearchModal render-loop regressions are tested.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm -C apps/web test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/.next
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps/web/.next
      - uses: playwright/action@v1
        with:
          browser: chromium
      # Smoke slice (~30 tests). The full 1,385-test matrix runs nightly:
      # .github/workflows/nightly-e2e.yml
      - run: pnpm -C apps/web test:smoke

  innovation-backlog:
    name: Innovation Backlog Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate backlog schema and wave ordering
        run: python scripts/innovation_backlog.py validate
      - name: Contract tests for backlog integrity
        run: python -m pytest tests/contract/test_innovation_backlog_gate.py -q

  cost-gate:
    name: Cost Control Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monthly cost estimate from the deployment manifest
        run: python scripts/cost_estimate.py
      - name: Cost anti-pattern analysis
        run: python scripts/cost_guard.py check
      - name: Collect usage readings
        run: python scripts/cost_collect.py
      - name: Budget status (exit 2 means the bill is unknown, not zero)
        run: python scripts/cost_guard.py budget || [ $? -eq 2 ]
      - name: Contract tests for cost control
        run: python -m pytest tests/contract/test_cost_guard_gate.py -q
      - name: Claims gate: documents must match the code they describe
        run: python -m pytest tests/contract/test_claims_gate.py -q

  i18n-check:
    name: i18n Validation
    runs-on: ubuntu-latest
    needs: generate-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web i18n:compile

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: apps/web/.lighthouserc.json
          uploadArtifacts: true
