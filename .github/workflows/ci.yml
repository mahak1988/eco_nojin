name: Eco Nojin CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Lint & Type Check
  # ==========================================================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e .[dev]
      
      - name: Run Ruff (lint)
        run: |
          ruff check .
          ruff format --check .
      
      - name: Run MyPy (type check)
        run: |
          mypy engine/ database/ services/ --no-error-summary
        continue-on-error: true

  # ==========================================================================
  # Test
  # ==========================================================================
  test:
    name: 🧪 Test Python 3.11
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Run tests
        run: |
          pytest -xvs --tb=short
        continue-on-error: true

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit (security)
        run: |
          bandit -r engine/ database/ services/ -ll -q
        continue-on-error: true

  # ==========================================================================
  # Build Frontend
  # ==========================================================================
  frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      
      - name: Type check
        working-directory: ./frontend
        run: pnpm type-check
        continue-on-error: true
      
      - name: Build
        working-directory: ./frontend
        run: pnpm build
        continue-on-error: true

  # ==========================================================================
  # i18n Validation
  # ==========================================================================
  i18n:
    name: 🌐 i18n Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check i18n keys
        run: |
          echo "i18n validation placeholder"
          # TODO: python scripts/check_i18n.py
        continue-on-error: true