name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit safety ruff
      - name: Lint
        run: ruff check services/
      - name: Security
        run: |
          bandit -r services/ -f json -o bandit.json || true
          safety check -r requirements.txt || true
      - name: Test
        run: pytest tests/ -v --cov=services --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
