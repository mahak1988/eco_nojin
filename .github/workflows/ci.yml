name: Eco Nojin Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-regression-gate:
    name: Audit Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # These three auditors were in the tree but unwired, so they found real
      # defects nobody saw. They all exit non-zero today, so they are compared
      # against a recorded baseline: a regression blocks, the existing backlog
      # stays visible and stays owned.
      - name: Audit regression gate
        run: python scripts/audit_regression_gate.py
      - name: Contract tests for the audit gate
        run: python -m pytest tests/contract/test_audit_gate.py -q

  i18n-check:
    name: i18n Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

