name: Eco Nojin CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Lint & Type Check (Python)
  # ==========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (uv lock)
        run: |
          uv pip install --python "$(which python)" -r requirements.lock.txt
          uv pip install --python "$(which python)" ruff mypy

      - name: Run Ruff (lint)
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy (type check)
        run: |
          mypy engine/ database/ services/ --no-error-summary
        continue-on-error: true

  # ==========================================================================
  # Test (Python)
  # ==========================================================================
  test:
    name: Test Python 3.11
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (uv lock)
        run: |
          uv pip install --python "$(which python)" -r requirements.lock.txt

      - name: Run pytest
        run: |
          python -m pytest --tb=short -q

  # ==========================================================================
  # Frontend build (Next.js 16 — CVE-2025-66478 fixed baseline)
  # ==========================================================================
  frontend:
    name: Frontend build (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
