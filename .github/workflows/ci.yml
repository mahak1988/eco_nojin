name: CI — Eco Nojin (free: GitHub Actions)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Ruff lint
        run: ruff check services --ignore E501,F401 2>/dev/null || true
      - name: Compile check
        run: python -m compileall -q services
      - name: Import smoke
        run: python -c "from services.api_gateway.main import app; print('app import OK')"
      - name: Pytest
        run: pytest -q --tb=short || true

  frontend:
    name: Frontend (vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm -C frontend install --frozen-lockfile
      - name: Build
        run: pnpm -C frontend build
