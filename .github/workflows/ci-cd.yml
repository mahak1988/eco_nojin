# GitHub Actions CI/CD Pipeline for Eco Nojin

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '1.8.3'

jobs:
  # =============================================================================
  # LINT & TYPE CHECK
  # =============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format --check .

      - name: Run MyPy (type check)
        run: mypy --strict engine/hydroma/config/settings.py services/api_gateway/

  # =============================================================================
  # CONTRACT TESTS (Schemathesis)
  # =============================================================================
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install schemathesis pytest pytest-cov

      - name: Generate OpenAPI schema
        run: |
          python scripts/generate_openapi_schema.py

      - name: Run Contract Tests
        run: |
          pytest tests/test_contract.py -v --tb=short

  # =============================================================================
  # INTEGRITY GATES (phase 3)
  #
  # G1 import smoke      - every services/ module must import
  # G2 no fabricated OK  - S-HONEST registry truthful, no new fabrications
  # G3 coverage floor    - fail_under in pyproject.toml, never lowered
  # G4 dead-code ratchet - vulture findings may fall, never rise
  # G5 layering contract - routers must not query the DB
  # G6 scientific gate   - a new motor needs a numeric conformance test
  #
  # The gates are ratchets, not zero-bars: they are configured against
  # docs/metrics/baseline.json, so existing debt is allowed and growth is not.
  # =============================================================================
  integrity-gates:
    name: Integrity Gates (G1-G6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov vulture

      - name: Verify the ratchet baseline is reproducible
        # Catches someone editing baseline.json to silence a gate: the recorded
        # values must match what the scanners actually measure on this tree.
        run: python scripts/measure_baseline.py --check

      - name: Run the gates
        run: |
          pytest tests/contract -v --tb=short \
            -k "g1 or g2 or g3 or g5 or g6 or s_honest or s_money or s_sci"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-gate-baseline
          path: docs/metrics/baseline.json
          retention-days: 30

  # =============================================================================
  # MUTATION TESTING (mutmut)
  # =============================================================================
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mutmut pytest pytest-cov pytest-asyncio

      - name: Run Mutation Testing (models)
        run: |
          mutmut run \
            --paths-to-mutate=engine/hydroma/models,engine/hydroma/soil,engine/hydroma/climate_adaptation \
            --tests-dir=tests \
            --runner="pytest -x -q" \
            --max-runtime=300 \
            --dict-class=mutmut.trampoline.Dict \
            || true

      - name: Mutation Testing Report
        if: always()
        run: |
          mutmut results --dict-class=mutmut.trampoline.Dict
          mutmut html --dict-class=mutmut.trampoline.Dict
          echo "Mutation testing completed. Check HTML report."

      - name: Upload Mutation HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: html
          retention-days: 7

      - name: Check Mutation Score
        run: |
          python scripts/check_mutation_score.py

  # =============================================================================
  # CONTRACT TEST EXPANSION (Schemathesis against all routers)
  # =============================================================================
  contract-expansion:
    name: Contract Test Expansion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install schemathesis pytest pytest-cov hypothesis

      - name: Generate OpenAPI Schema
        run: |
          python scripts/generate_openapi_schema.py

      - name: Run Schemathesis Against All Endpoints
        run: |
          schemathesis run \
            --hypothesis-max-examples=50 \
            --hypothesis-deadline=5000 \
            --checks=all \
            --rate-limit=10 \
            --timeout=30 \
            openapi.json \
            --base-url=http://localhost:8000 \
            || true

      - name: Run Contract Tests (existing)
        run: |
          pytest tests/test_contract.py -v --tb=short

  # =============================================================================
  # NUMERICAL REGRESSION TESTS
  # =============================================================================
  numerical-regression:
    name: Numerical Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio hypothesis

      - name: Run Scientific Model Correctness Tests
        run: |
          pytest tests/integration/test_models_phase7.py::TestNumericConformance -v --tb=short

      - name: Run Penman-Monteith Reference Validation
        run: |
          pytest tests/unit/test_penman_monteith.py -v --tb=short

      - name: Run MRV QA Metrics Validation
        run: |
          pytest tests/unit/test_mrv_qa_metrics.py -v --tb=short

      - name: Run Hydroma Hub Tests
        run: |
          pytest tests/unit/test_hydroma_hub.py -v --tb=short

      - name: Run C++ Bridge Parity Tests
        run: |
          pytest engine/hydroma/cpp_bridge/tests/test_parity.py -v --tb=short

  # =============================================================================
  # ENGINE STRICT TESTS (S00-S14)
  # =============================================================================
  # The 916-test strict suite protects the numerical kernel: 108 registered
  # defects, each with its file:line, its governing standard and the measured
  # magnitude of the error. Until this job existed nothing ran it, so a merge
  # could regress FAO-56 conformance or the C++/Python parity with a green
  # pipeline.
  #
  # It builds the C++ core because 20 of the tests compare the Python engine
  # against it and have no Python fallback to compare with. Without the build
  # they skip, and the run is green while asserting less -- which is why the
  # copy step and the availability check below are not optional.
  engine-strict:
    name: Engine Strict Tests (S00-S14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libopenmp-dev \
            ninja-build \
            python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # pybind11 is only in the `dev` extra, and hypothesis is in no extra
          # at all, so both are named explicitly. scipy is only in `ml`, which
          # would drag in scikit-learn and transformers for one expi() call.
          pip install -e ".[dev]"
          pip install pybind11==2.13.6 hypothesis scipy

      - name: Configure C++ core
        working-directory: engine/cpp_core
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DHYDROMA_BUILD_TESTS=OFF \
            -DHYDROMA_BUILD_PYTHON_BINDINGS=ON \
            -DHYDROMA_BUILD_BENCHMARKS=OFF \
            -G Ninja

      - name: Build C++ core
        working-directory: engine/cpp_core
        run: cmake --build build --parallel 4

      - name: Place the extension where the bridge looks for it
        run: |
          # cpp_bridge/__init__.py appends only its own directory to sys.path and
          # then does a flat `import hydroma_core`. It never looks in the CMake
          # build tree, so the module has to be copied next to __init__.py. Copy
          # rather than rename: the ABI tag in the filename is load-bearing.
          ls -l engine/cpp_core/build/hydroma_core*.so
          cp engine/cpp_core/build/hydroma_core*.so engine/hydroma/cpp_bridge/

      - name: Fail if the C++ core did not build
        run: |
          python -c "
          from engine.hydroma.cpp_bridge import get_module
          assert get_module() is not None, 'hydroma_core did not load'
          print('C++ core available')
          "

      - name: Run strict suite
        run: |
          pytest engine/strict_tests -q \
            --hypothesis-profile=strict-engine-ci \
            -o addopts=--strict-markers

      - name: Run engine tests with coverage
        run: |
          pytest \
            engine/strict_tests \
            engine/land \
            engine/hydroma/cpp_bridge/tests \
            engine/hydroma/soil/tests \
            engine/hydroma/watershed/tests \
            engine/hydroma/biofertilizer/tests \
            engine/hydroma/groundwater/tests \
            engine/hydroma/plant_neuro/tests \
            engine/hydroma/data_pipeline/tests \
            -q --tb=short --benchmark-disable \
            --cov=engine --cov-branch \
            --cov-report=term:skip-covered \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-coverage
          path: coverage.xml
          retention-days: 7

  # =============================================================================
  # SERVICES COVERAGE (phase 5)
  #
  # `services/` is ~30% of the codebase and until now no CI job measured it at
  # all: the only coverage job above scopes to `engine`. Measured for the first
  # time in phase 5, `services` sits at 41%, so the floor starts at 38 — three
  # points of headroom for normal variation, and a ratchet that makes any
  # decline fail the build. Raise it as coverage genuinely improves; never lower
  # it to make a build pass.
  #
  # Enforced by tests/contract/test_g3_g4_coverage_and_deadcode.py.
  # =============================================================================
  services-coverage:
    name: Services Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-xdist

      - name: Run services tests with coverage
        run: |
          pytest services -q --tb=short -n 4 \
            --cov=services --cov-branch \
            --cov-report=term:skip-covered \
            --cov-report=xml \
            --cov-fail-under=38

      - name: Upload services coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-coverage
          path: coverage.xml
          retention-days: 7

  # =============================================================================
  # LOAD TESTING (Locust)
  # =============================================================================
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install locust pytest pytest-cov

      - name: Start API Server
        run: |
          nohup uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          sleep 10
          curl -f http://localhost:8000/health/live || exit 1

      - name: Run Load Tests
        run: |
          locust -f tests/load/locustfile.py --headless -u 50 -t 60s --host=http://localhost:8000 --csv=load_results

      - name: Check Load Test Results
        run: |
          python scripts/check_load_results.py

      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load_results*
          retention-days: 7

  # =============================================================================
  # UNIT TESTS
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=engine --cov=services --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # =============================================================================
  # INTEGRATION TESTS
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Integration Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/integration/ -v --tb=short

  # =============================================================================
  # DATABASE MIGRATION TEST
  # =============================================================================
  db-migration:
    name: Database Migration Test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install alembic

      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: sqlite:///./test_migration.db
        run: |
          alembic upgrade heads

      - name: Verify Schema
        run: |
          python scripts/verify_migration_schema.py

  # =============================================================================
  # DATABASE MIGRATION TEST (PostgreSQL with testcontainers)
  # =============================================================================
  db-migration-postgres:
    name: Database Migration Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: econojin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d econojin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install alembic psycopg2-binary pytest pytest-asyncio testcontainers

      - name: Run PostgreSQL Migration Tests
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/econojin_test
        run: |
          pytest tests/integration/test_postgres_migrations.py -v --tb=short

  # =============================================================================
  # BUILD & PUSH DOCKER IMAGE (on main)
  # =============================================================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, frontend, contract-tests, mutation-testing, contract-expansion, numerical-regression, engine-strict, load-testing, unit-tests, integration-tests, db-migration, db-migration-postgres]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # DEPLOY TO STAGING (disabled until the deployment contract is green)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: false
    needs: [docker]
    environment: staging
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # e.g., kubectl apply -f k8s/staging/
          # or docker-compose -f docker-compose.staging.yml up -d

  # =============================================================================
  # DEPLOY TO PRODUCTION (on main, manual approval)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: false
    needs: [docker]
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # e.g., kubectl apply -f k8s/production/
          # or docker-compose -f docker-compose.prod.yml up -d