name: Nightly E2E (full suite)

# The pull-request gate runs a ~30-test smoke slice (see .github/workflows/ci.yml).
# The full 1,385-test matrix is too slow for every push, so it runs nightly.
# Both suites must run against a built server: `next dev` breaks client-side
# navigation in this repository (server-side renders are fine, clicks are not).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: Full Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - uses: playwright/action@v1
        with:
          browser: chromium
      - run: pnpm -C apps/web test:e2e:full
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
