apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eco-nojin.fullname" . }}-api-gateway-secrets
  namespace: {{ include "eco-nojin.namespace" . }}
  labels:
    {{- include "eco-nojin.labels" . | nindent 4 }}
    app: api-gateway
type: Opaque
stringData:
  # These values should be set via External Secrets Operator
  # Do not commit actual values to git
  SECRET_KEY: {{ .Values.secrets.secretKey | default "REPLACE_WITH_ACTUAL_SECRET_KEY" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "REPLACE_WITH_ACTUAL_JWT_SECRET" | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "postgresql://user:password@postgresql:5432/eco_nojin" | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | default "redis://:password@redis-master:6379/0" | quote }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | default "https://your-project.supabase.co" | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | default "REPLACE_WITH_SUPABASE_SERVICE_ROLE_KEY" | quote }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseAnonKey | default "REPLACE_WITH_SUPABASE_ANON_KEY" | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | default "REPLACE_WITH_TELEGRAM_BOT_TOKEN" | quote }}
  CDSE_CLIENT_ID: {{ .Values.secrets.cdseClientId | default "REPLACE_WITH_CDSE_CLIENT_ID" | quote }}
  CDSE_CLIENT_SECRET: {{ .Values.secrets.cdseClientSecret | default "REPLACE_WITH_CDSE_CLIENT_SECRET" | quote }}
  CDS_API_KEY: {{ .Values.secrets.cdsApiKey | default "REPLACE_WITH_CDS_API_KEY" | quote }}
  ALCHEMY_API_KEY: {{ .Values.secrets.alchemyApiKey | default "REPLACE_WITH_ALCHEMY_API_KEY" | quote }}