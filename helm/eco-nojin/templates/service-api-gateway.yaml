{{- if .Values.api-gateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eco-nojin.fullname" . }}-api-gateway
  namespace: {{ include "eco-nojin.namespace" . }}
  labels:
    {{- include "eco-nojin.labels" . | nindent 4 }}
    app: api-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: {{ .Values.api-gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.api-gateway.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: grpc
      port: {{ .Values.api-gateway.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
  selector:
    app: api-gateway
    release: {{ .Release.Name }}
  sessionAffinity: None
  topologyKeys:
    - topology.kubernetes.io/zone
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eco-nojin.fullname" . }}-api-gateway-headless
  namespace: {{ include "eco-nojin.namespace" . }}
  labels:
    {{- include "eco-nojin.labels" . | nindent 4 }}
    app: api-gateway
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    app: api-gateway
    release: {{ .Release.Name }}
{{- end }}