apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eco-nojin.fullname" . }}-api-gateway-config
  namespace: {{ include "eco-nojin.namespace" . }}
  labels:
    {{- include "eco-nojin.labels" . | nindent 4 }}
    app: api-gateway
data:
  ENVIRONMENT: {{ .Values.api-gateway.config.environment | quote }}
  LOG_LEVEL: {{ .Values.api-gateway.config.logLevel | quote }}
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  CORS_ORIGINS: '["https://app.{{ .Values.global.domain }}", "https://api.{{ .Values.global.domain }}"]'
  {{- if .Values.api-gateway.config.redis.enabled }}
  REDIS_HOST: {{ .Values.api-gateway.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.api-gateway.config.redis.port | quote }}
  {{- end }}
  {{- if .Values.api-gateway.config.database.host }}
  DATABASE_HOST: {{ .Values.api-gateway.config.database.host | quote }}
  DATABASE_PORT: {{ .Values.api-gateway.config.database.port | quote }}
  DATABASE_NAME: "eco_nojin"
  {{- end }}
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"