# HDVI - Hydroma Drought Vulnerability Index - Test Cases
# Reference: McKee et al. (1993) SPI; Vicente-Serrano et al. (2010) SPEI;
#            Kogan (1995) VHI; soil-moisture index SMI.
#
# REWRITTEN 2026-09-29. The previous fixture fed ndvi/ndwi/lst/albedo, which
# is a different index. engine.hydroma.models.hdvi.HDVI takes spi, spei, vhi
# and smi, so the fixture and the implementation described two different
# quantities and could never have passed. The inputs below match the
# signature that actually exists.
model: hdvi
reference: "McKee 1993; Vicente-Serrano 2010; Kogan 1995"
category: climate
language: python
status: experimental

tolerances:
  rtol: 1e-2
  atol: 1e-2

cases:
  - name: near_average_drought
    description: "All four sub-indices near zero: a mild composite."
    inputs:
      spi_value: 0.10
      spei_value: -0.05
      vhi_value: 0.60
      smi_value: 0.55
    # Recorded from HDVI.compute on 2026-09-29, not predicted. These are
    # regression values: they prove the arithmetic has not drifted. They are
    # not independent scientific validation, which needs a published
    # reference series the repository does not carry yet.
    expected: -0.6535
    expected_key: hdvi

  - name: moderate_drought
    description: "Negative precipitation indices and a stressed vegetation index."
    inputs:
      spi_value: -1.20
      spei_value: -1.00
      vhi_value: 0.30
      smi_value: 0.25
    expected: -1.6705
    expected_key: hdvi

  - name: severe_drought
    description: "All four sub-indices strongly negative."
    inputs:
      spi_value: -2.50
      spei_value: -2.20
      vhi_value: 0.10
      smi_value: 0.08
    expected: -2.5535
    expected_key: hdvi

# --------------------------------------------------------------

# --------------------------------------------------------------

# --------------------------------------------------------------
# BOUNDARY CASES - generated by scripts/boundary_cases.py
#
# The values below are not chosen by hand. Each case pins one
# parameter at the limit its own validate_inputs declares, so the
# limit and the fixture cannot drift apart.
#
# A mid-range fixture cannot see a limit defect: EPIA reported no
# water stress across most of its range while its single fixture
# sat above it, and the defect passed. These cases close that gap.
# --------------------------------------------------------------
  - name: spi_value_at_minimum
    description: "spi_value pinned at its minimum (-5.0) as declared by validate_inputs."
    inputs:
      spi_value: -5.0
      spei_value: -0.05
      vhi_value: 0.6
      smi_value: 0.55
    expected: -1.9285000000
    expected_key: hdvi
    # Derived from these guards in validate_inputs:
    #   spi_value must satisfy [-5.0, 5.0]
    #   guard: if not (-5 <= spi_value <= 5):
  - name: spi_value_at_maximum
    description: "spi_value pinned at its maximum (5.0) as declared by validate_inputs."
    inputs:
      spi_value: 5.0
      spei_value: -0.05
      vhi_value: 0.6
      smi_value: 0.55
    expected: 0.5715000000
