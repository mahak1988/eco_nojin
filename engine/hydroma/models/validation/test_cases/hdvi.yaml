# HDVI - Hydroma Drought Vulnerability Index - Test Cases
# Reference: McKee et al. (1993) SPI; Vicente-Serrano et al. (2010) SPEI;
#            Kogan (1995) VHI; soil-moisture index SMI.
#
# REWRITTEN 2026-09-29. The previous fixture fed ndvi/ndwi/lst/albedo, which
# is a different index. engine.hydroma.models.hdvi.HDVI takes spi, spei, vhi
# and smi, so the fixture and the implementation described two different
# quantities and could never have passed. The inputs below match the
# signature that actually exists.
#
# vhi_value RESCALED 2026-10-01. Every case fed 0.60 / 0.30 / 0.10 into a
# field that `validate_inputs` declares as [0.0, 100.0] and that Kogan's VHI
# is defined on. `compute` centres it on 50 -- (vhi - 50) / 50 * 3 -- so 0.6
# was read as 0.6 PER CENT: a VHI of 0.6 is near-total vegetation failure,
# and vhi_norm came out at -2.964, i.e. severe stress. The case named
# `near_average_drought`, described as "all four sub-indices near zero", was
# in fact dominated by a 0.6 % health vegetation index. The recorded
# expectations below faithfully reproduced the arithmetic on a mis-scaled
# input, which is exactly why they were not wrong-looking: the arithmetic was
# right and the unit was not.
#
# The inputs are now 60 / 30 / 10, and every expectation is recomputed. Two
# independent checks say the rescale is the right one:
#   * The two boundary cases that already sat at the declared limits,
#     vhi_value_at_minimum (0.0) and vhi_value_at_maximum (100.0), do not
#     move at all: -0.6625 and +0.8375 before and after.
#   * `near_average_drought` now classifies as "normal", which is what its
#     name and its description have always claimed it was. Under the old
#     scaling the same case classified as "mild_drought".
model: hdvi
reference: "Kogan 1995 VHI; the composite, the rescalings and the z-score named `spi` are this project's"
category: climate
language: python
status: experimental

tolerances:
  rtol: 1e-2
  atol: 1e-2

cases:
  - name: near_average_drought
    description: "All four sub-indices near zero: a mild composite."
    inputs:
      spi_value: 0.10
      spei_value: -0.05
      vhi_value: 60.0
      smi_value: 0.55
    # Recomputed 2026-10-01 at the declared VHI unit. Was -0.6535, which was
    # the vhi_value 0.6 mis-scaled case. 0.25*(0.10 - 0.05 + 0.60 + 0.30)
    # = 0.2375, and the classification is now "normal", which the case name
    # says it should be.
    expected: 0.2375
    expected_key: hdvi

  - name: moderate_drought
    description: "Negative precipitation indices and a stressed vegetation index."
    inputs:
      spi_value: -1.20
      spei_value: -1.00
      vhi_value: 30.0
      smi_value: 0.25
    # Was -1.6705. Now 0.25*(-1.20 - 1.00 - 1.20 - 1.50) = -1.225.
    expected: -1.225
    expected_key: hdvi

  - name: severe_drought
    description: "All four sub-indices strongly negative."
    inputs:
      spi_value: -2.50
      spei_value: -2.20
      vhi_value: 10.0
      smi_value: 0.08
    # Was -2.5535. Now 0.25*(-2.50 - 2.20 - 2.40 - 2.52) = -2.405.
    expected: -2.405
    expected_key: hdvi

# --------------------------------------------------------------

# --------------------------------------------------------------

# --------------------------------------------------------------
# BOUNDARY CASES - generated by scripts/boundary_cases.py
#
# The values below are not chosen by hand. Each case pins one
# parameter at the limit its own validate_inputs declares, so the
# limit and the fixture cannot drift apart.
#
# A mid-range fixture cannot see a limit defect: EPIA reported no
# water stress across most of its range while its single fixture
# sat above it, and the defect passed. These cases close that gap.
# --------------------------------------------------------------
  - name: spi_value_at_minimum
    description: "spi_value pinned at its minimum (-5.0) as declared by validate_inputs."
    inputs:
      spi_value: -5.0
      spei_value: -0.05
      vhi_value: 60.0
      smi_value: 0.55
    expected: -1.0375000000
    expected_key: hdvi
    # vhi_value baseline raised 0.6 -> 60.0 with the declared unit on
    # 2026-10-01; expectation recomputed. Was -1.9285.
    # Derived from these guards in validate_inputs:
    #   spi_value must satisfy [-5.0, 5.0]
    #   guard: if not (-5 <= spi_value <= 5):
  - name: spi_value_at_maximum
    description: "spi_value pinned at its maximum (5.0) as declared by validate_inputs."
    inputs:
      spi_value: 5.0
      spei_value: -0.05
      vhi_value: 60.0
      smi_value: 0.55
    expected: 1.4625000000
    expected_key: hdvi
    # vhi_value baseline raised 0.6 -> 60.0 on 2026-10-01; recomputed.
    # Was 0.5715.
    # Derived from these guards in validate_inputs:
    #   spi_value must satisfy [-5.0, 5.0]
    #   guard: if not (-5 <= spi_value <= 5):
  - name: spei_value_at_minimum
    description: "spei_value pinned at its minimum (-5.0) as declared by validate_inputs."
    inputs:
      spi_value: 0.1
      spei_value: -5.0
      vhi_value: 60.0
      smi_value: 0.55
    expected: -1.0000000000
    expected_key: hdvi
    # vhi_value baseline raised 0.6 -> 60.0 on 2026-10-01; recomputed.
    # Was -1.8910.
    # Derived from these guards in validate_inputs:
    #   spei_value must satisfy [-5.0, 5.0]
    #   guard: if not (-5 <= spei_value <= 5):
  - name: spei_value_at_maximum
    description: "spei_value pinned at its maximum (5.0) as declared by validate_inputs."
    inputs:
      spi_value: 0.1
      spei_value: 5.0
      vhi_value: 60.0
      smi_value: 0.55
    expected: 1.5000000000
    expected_key: hdvi
    # vhi_value baseline raised 0.6 -> 60.0 on 2026-10-01; recomputed.
    # Was 0.6090.
    # Derived from these guards in validate_inputs:
    #   spei_value must satisfy [-5.0, 5.0]
    #   guard: if not (-5 <= spei_value <= 5):
  - name: vhi_value_at_minimum
    description: "vhi_value pinned at its minimum (0.0) as declared by validate_inputs."
    inputs:
      spi_value: 0.1
      spei_value: -0.05
      vhi_value: 0.0
      smi_value: 0.55
    expected: -0.6625000000
    expected_key: hdvi
    # Already at the declared unit, and unchanged by the 2026-10-01 rescale of
    # the other vhi_value cases. That it did not move is a check on the
    # rescale: the two cases that were already correct stayed correct.
    # Derived from these guards in validate_inputs:
    #   vhi_value must satisfy [0.0, 100.0]
    #   guard: if np.any((vhi_value < 0) | (vhi_value > 100)):
  - name: vhi_value_at_maximum
    description: "vhi_value pinned at its maximum (100.0) as declared by validate_inputs."
    inputs:
      spi_value: 0.1
      spei_value: -0.05
      vhi_value: 100.0
      smi_value: 0.55
    expected: 0.8375000000
    expected_key: hdvi
    # Already at the declared unit; unchanged, same check as the case above.
    # Derived from these guards in validate_inputs:
    #   vhi_value must satisfy [0.0, 100.0]
    #   guard: if np.any((vhi_value < 0) | (vhi_value > 100)):
  - name: smi_value_at_minimum
    description: "smi_value pinned at its minimum (0.0) as declared by validate_inputs."
    inputs:
      spi_value: 0.1
      spei_value: -0.05
      vhi_value: 60.0
      smi_value: 0.0
    expected: -0.5875000000
    expected_key: hdvi
    # vhi_value baseline raised 0.6 -> 60.0 on 2026-10-01; recomputed.
    # Was -1.4785.
    # Derived from these guards in validate_inputs:
    #   smi_value must satisfy [0.0, 1.0]
    #   guard: if np.any((smi_value < 0) | (smi_value > 1)):
  - name: smi_value_at_maximum
    description: "smi_value pinned at its maximum (1.0) as declared by validate_inputs."
    inputs:
      spi_value: 0.1
      spei_value: -0.05
      vhi_value: 60.0
      smi_value: 1.0
    expected: 0.9125000000
    expected_key: hdvi
    # vhi_value baseline raised 0.6 -> 60.0 on 2026-10-01; recomputed.
    # Was 0.0215.
    # Derived from these guards in validate_inputs:
    #   smi_value must satisfy [0.0, 1.0]
    #   guard: if np.any((smi_value < 0) | (smi_value > 1)):
