# Check Dam Design - Test Cases
# Reference: FAO Watershed Management Field Manual

model: check_dam
reference: "FAO Watershed Management Field Manual"
category: watershed
language: python
status: partial

tolerances:
  rtol: 1e-2
  atol: 1e-2

cases:
  - name: standard_check_dam
    description: "Standard check dam design with typical parameters"
    inputs:
      slope_pct: 5.0
      area_m2: 50000.0  # 5 ha
      rainfall_mm: 100.0
      target_retention_years: 10
      channel_width_m: 5.0
      sediment_yield_t_ha_yr: 5.0
      side_slope_hv: 1.5
      storm_duration_h: 6.0
      sediment_bulk_density_t_m3: 1.3
      unit_cost_usd_m3: 150.0
    expected:
      dam_height_m: 1.8
      dam_length_m: 12.5
      storage_volume_m3: 1500.0
      spillway_width_m: 3.5
      estimated_cost_usd: 225000.0
      trap_efficiency: 0.75
      rtol: 1e-1

  - name: steep_slope_check_dam
    description: "Check dam on steeper slope"
    inputs:
      slope_pct: 15.0
      area_m2: 20000.0
      rainfall_mm: 150.0
      target_retention_years: 15
      channel_width_m: 4.0
      sediment_yield_t_ha_yr: 10.0
      side_slope_hv: 2.0
      storm_duration_h: 4.0
      sediment_bulk_density_t_m3: 1.4
      unit_cost_usd_m3: 180.0
    expected:
      dam_height_m: 2.5
      dam_length_m: 8.0
      storage_volume_m3: 800.0
      rtol: 1e-1

# Metadata for CI matrix
ci_matrix:
  backends: ["python"]
  priority: medium
  estimated_time_seconds: 30