# SCS-CN Runoff Model - Test Cases
# Reference: SCS National Engineering Handbook Section 4; NRCS TR-55
# Standard SI Form: S = 25400/CN - 254 [mm]; Ia = 0.2*S; Q = (P-Ia)²/(P+0.8S)

model: scs_cn
reference: "SCS National Engineering Handbook Section 4; NRCS TR-55; https://www.nrcs.usda.gov/"
category: hydrology
language: python
status: validated

tolerances:
  rtol: 1e-6
  atol: 1e-9
  volume_abs_tol: 1.0  # m³

cases:
  - name: standard_example_cn70_p50mm
    description: "Standard textbook example: CN=70, P=50mm, Area=10ha"
    inputs:
      precipitation_mm: 50.0
      curve_number: 70
      area_ha: 10.0
      method: "SCS-CN"
    expected:
      # S = 25400/70 - 254 = 108.857 mm
      # Ia = 0.2 * 108.857 = 21.771 mm
      # Q = (50 - 21.771)² / (50 + 0.8*108.857) = 5.813 mm
      # Volume = 5.813 * 10 * 10 = 581.3 m³
      runoff_depth_mm: 5.813
      volume_m3: 581.3
      note: "Validates SI unit formula fix (D1 fix)"

  - name: high_cn_saturated
    description: "High CN (95) with moderate rain - near saturation"
    inputs:
      precipitation_mm: 30.0
      curve_number: 95
      area_ha: 5.0
      method: "SCS-CN"
    expected:
      # S = 25400/95 - 254 = 13.368 mm
      # Ia = 0.2 * 13.368 = 2.674 mm
      # Q = (30 - 2.674)² / (30 + 0.8*13.368) = 18.35 mm
      runoff_depth_mm: 18.35
      volume_m3: 917.5

  - name: low_cn_dry
    description: "Low CN (40) with light rain - no runoff expected"
    inputs:
      precipitation_mm: 10.0
      curve_number: 40
      area_ha: 20.0
      method: "SCS-CN"
    expected:
      # S = 25400/40 - 254 = 381 mm
      # Ia = 76.2 mm > P=10mm → Q = 0
      runoff_depth_mm: 0.0
      volume_m3: 0.0

  - name: edge_case_cn100
    description: "CN=100 (impervious) - all rainfall becomes runoff"
    inputs:
      precipitation_mm: 25.0
      curve_number: 100
      area_ha: 1.0
      method: "SCS-CN"
    expected:
      # S = 0, Ia = 0, Q = P = 25 mm
      runoff_depth_mm: 25.0
      volume_m3: 250.0

  - name: spatial_cn_map_uniform_rain
    description: "Spatial SCS-CN with uniform rainfall over heterogeneous CN map"
    inputs:
      method: "SCS-CN"
      precipitation_mm: 40.0
      # CN map: 50% CN=60, 50% CN=80
      # Weighted S = 0.5*(25400/60-254) + 0.5*(25400/80-254)
      # = 0.5*168.67 + 0.5*63.5 = 116.08 mm
      cn_map_values: [60, 80]  # Simplified - actual test uses xarray
      area_ha: 100.0
    expected:
      # Weighted average Q
      volume_m3: 12450.0
      tolerance: 50.0  # m³

  - name: cn_boundary_validation
    description: "CN boundary validation - CN must be 0-100"
    inputs:
      precipitation_mm: 50.0
      curve_number: 150  # Invalid
      area_ha: 10.0
      method: "SCS-CN"
    expected:
      error: "ValidationError"
      message_contains: "curve_number must be between 0 and 100"

# Metadata for CI matrix
ci_matrix:
  backends: ["python"]
  priority: high
  estimated_time_seconds: 30