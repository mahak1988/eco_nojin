# ECSI - values recorded from an actual run on 2026-09-29
#
# Reference: Coleman & Jenkinson (1996) RothC-26.3, Rothamsted Research.
#            This is a faithful implementation of a published model, not a
#            novel one: the formula is theirs, the code is ours.
#
# The kernel is the standard RothC monthly scheme over four active pools
# (DPM, RPM, BIO, HUM) plus an inert IOM. Verified by hand:
#   initial 45.0 t/ha splits to pools 41.257 + IOM 3.743 = 45.0 exactly
#   temperature factor at 18 C = 2.442 (a RATE modifier, so above 1 is
#     correct: warm soil decomposes faster; the peak is near 9-10 C)
#   moisture factor at SMD 20 mm = 0.84
#   plant retain, arable = 0.60
#   CO2 equivalent = delta_soc * 3.667, checked to 6 decimal places
#
# Note on total_decomposition: it exceeds input minus delta because the
# stabilised fraction (~22% at 23% clay) leaves the decomposed total and
# re-enters BIO and HUM. That is humification moving carbon between pools,
# not carbon leaving the soil. The name is easy to misread.
model: ECSI
class: ECSI
reference: "Coleman & Jenkinson 1996, RothC-26.3 (Rothamsted)"
language: python
status: validated
recorded: 2026-09-29

tolerances:
  rtol: 0.01
  atol: 0.01

cases:
  - name: arable_one_year
    description: "45 t/ha starting SOC, 1.2 t/ha/yr carbon input, arable clay loam."
    inputs:
      initial_soc_t_ha: 45.0
      carbon_input_t_ha: 1.2
      t_mean_c: 18.0
      rainfall_mm: 420.0
      evaporation_mm: 520.0
      clay_fraction: 0.23
      land_use: arable
      dt_years: 1.0
      smd_mm: 20.0
    expected: -2.28730228
    expected_key: delta_soc_t_ha_yr

