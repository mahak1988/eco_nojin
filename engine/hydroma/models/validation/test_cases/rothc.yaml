# RothC-26.3 Carbon Model - Test Cases
# Reference: Coleman & Jenkinson 1996; RothC-26.3 Documentation
# 4 active pools (DPM, RPM, BIO, HUM) + inert IOM
# Monthly time step, clay-dependent stabilization, T & moisture modifiers

model: rothc
reference: "Coleman & Jenkinson 1996 'RothC-26.3'; Rothamsted Research"
category: carbon
language: python
status: validated

tolerances:
  rtol: 1e-3
  atol: 1e-5
  mass_balance_max: 1e-4  # tC/ha

parameters:
  # Decomposition rates (yr^-1)
  k_DPM: 10.0
  k_RPM: 0.3
  k_BIO: 0.66
  k_HUM: 0.02
  # IOM parameter
  iom_coeff: 0.049
  iom_exp: 1.139
  # Partitioning
  DPM_RPM_ratio: 1.44  # 0.59/0.41
  P_factor: 0.6  # humification fraction

cases:
  - name: standard_reference_run
    description: "Standard reference run matching RothC-26.3 published examples"
    inputs:
      initial_soc_t_ha: 100.0
      clay_pct: 23.0
      monthly_inputs:
        # tC/ha/month for 12 months
        carbon_input: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
        dpm_rpm_split: [0.59, 0.59, 0.59, 0.59, 0.59, 0.59, 0.59, 0.59, 0.59, 0.59, 0.59, 0.59]
      monthly_climate:
        temp_c: [5.0, 6.0, 9.0, 12.0, 15.0, 18.0, 20.0, 19.0, 16.0, 12.0, 8.0, 5.0]
        smd_mm: [0.0, 0.0, 10.0, 30.0, 60.0, 80.0, 90.0, 80.0, 50.0, 20.0, 5.0, 0.0]
        max_smd_mm: 100.0
      p_factor: 0.6
    expected:
      # From RothC-26.3 reference output for this scenario
      final_soc_t_ha: 97.605  # ~2.4 tC/ha loss over year
      final_dpm_t_ha: 0.55
      final_rpm_t_ha: 8.92
      final_bio_t_ha: 14.85
      final_hum_t_ha: 73.28
      final_iom_t_ha: 9.29  # 0.049 * 100^1.139
      cumulative_co2_t_ha: 2.40
      rtol: 1e-2

  - name: clay_dependence_partitioning
    description: "Test clay-dependent stabilization split"
    inputs:
      initial_soc_t_ha: 50.0
      clay_pct: 10.0  # Sandy soil - low stabilization
      monthly_inputs:
        carbon_input: [1.0]*12
        dpm_rpm_split: [0.59]*12
      monthly_climate:
        temp_c: [15.0]*12
        smd_mm: [0.0]*12
        max_smd_mm: 50.0
      p_factor: 0.6
    expected:
      # Clay 10%: x = 1.67*(1.85 + 1.60*exp(-0.0786*10)) = 4.68
      # stabilized_fraction = 1/(1+x) = 0.176
      stabilized_fraction: 0.176
      co2_fraction: 0.824
      rtol: 1e-2

  - name: high_clay_stabilization
    description: "High clay (40%) - high stabilization"
    inputs:
      initial_soc_t_ha: 50.0
      clay_pct: 40.0
      monthly_inputs:
        carbon_input: [1.0]*12
        dpm_rpm_split: [0.59]*12
      monthly_climate:
        temp_c: [15.0]*12
        smd_mm: [0.0]*12
        max_smd_mm: 50.0
      p_factor: 0.6
    expected:
      # Clay 40%: x = 1.67*(1.85 + 1.60*exp(-0.0786*40)) = 3.13
      # stabilized_fraction = 1/(1+x) = 0.242
      stabilized_fraction: 0.242
      co2_fraction: 0.758
      rtol: 1e-2

  - name: temperature_modifier
    description: "Temperature modifier at 10°C should be ~1.10"
    inputs:
      initial_soc_t_ha: 100.0
      clay_pct: 25.0
      monthly_inputs:
        carbon_input: [0.0]*12  # No inputs - pure decomposition
        dpm_rpm_split: [0.59]*12
      monthly_climate:
        temp_c: [10.0]*12
        smd_mm: [0.0]*12
        max_smd_mm: 100.0
      p_factor: 0.6
    expected:
      # fT(10°C) = 47.9/(1+exp(106.06/(10+18.27))) = 1.099
      temp_factor_at_10c: 1.099
      rtol: 1e-3
      # SOC should decrease due to decomposition only
      soc_decrease: True

  - name: moisture_modifier_boundary
    description: "Moisture modifier at SMD boundary (0.444*maxSMD)"
    inputs:
      initial_soc_t_ha: 100.0
      clay_pct: 25.0
      monthly_inputs:
        carbon_input: [0.0]*12
        dpm_rpm_split: [0.59]*12
      monthly_climate:
        temp_c: [15.0]*12
        smd_mm: [44.4]*12  # Exactly 0.444 * 100
        max_smd_mm: 100.0
      p_factor: 0.6
    expected:
      # At SMD = 0.444*maxSMD, fM = 0.6448 (first branch)
      moisture_factor: 0.6448
      rtol: 1e-4
      # Just above boundary
      moisture_factor_above: 0.3597  # At SMD = 0.444*maxSMD + epsilon
      rtol_above: 1e-3

  - name: iom_independence_from_clay
    description: "IOM calculation should be independent of clay content"
    inputs:
      initial_soc_t_ha: 80.0
      clay_pct: 40.0  # High clay
      monthly_inputs:
        carbon_input: [0.0]*12
        dpm_rpm_split: [0.59]*12
      monthly_climate:
        temp_c: [15.0]*12
        smd_mm: [0.0]*12
        max_smd_mm: 100.0
      p_factor: 0.6
    expected:
      # IOM = 0.049 * SOC^1.139 = 0.049 * 80^1.139 = 6.09
      # Should be SAME for any clay_pct
      iom_t_ha: 6.09
      rtol: 1e-2

  - name: mass_balance_identity
    description: "SOC balance: initial + inputs - CO2 = final SOC"
    inputs:
      initial_soc_t_ha: 100.0
      clay_pct: 25.0
      monthly_inputs:
        carbon_input: [1.0]*12
        dpm_rpm_split: [0.59]*12
      monthly_climate:
        temp_c: [15.0]*12
        smd_mm: [0.0]*12
        max_smd_mm: 100.0
      p_factor: 0.6
    expected:
      # SOC_final = SOC_initial + total_input - total_CO2
      mass_balance_error: "< 1e-4"
      rtol: 1e-4

# Metadata for CI matrix
ci_matrix:
  backends: ["python"]
  priority: high
  estimated_time_seconds: 60