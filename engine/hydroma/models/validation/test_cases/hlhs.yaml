# HLHS - values recorded from an actual run on 2026-09-29
#
# Reference: Shannon (1948) information entropy applied to landscape
#            structure; Nagendra et al. (2002) on fragmentation and
#            connectivity. The combination is ours; the inputs are standard
#            landscape metrics.
#
# Each metric is min-max normalised against the bounds the model declares,
# then combined with weights that sum to exactly 1. Verified by hand:
#   vegetation   (0.52-0.0)/(0.8-0.0)     = 0.650000  x 0.20 = 0.130000
#   water        1 - 0.47                   = 0.530000  x 0.20 = 0.106000
#   soil         42.0/100                    = 0.420000  x 0.15 = 0.063000
#   biodiversity (0.68-0.0)/(3.0-0.0)      = 0.226667  x 0.15 = 0.034000
#   carbon       (1.15+2)/(5+2)             = 0.450000  x 0.15 = 0.067500
#   topography   0.82                        = 0.820000  x 0.10 = 0.082000
#   connectivity 0.50                        = 0.500000  x 0.05 = 0.025000
#   sum = 0.507500  ->  hlhs = 50.75, classified "fair"
model: HLHS
class: HLHS
reference: "Shannon 1948; Nagendra et al. 2002"
language: python
status: validated
recorded: 2026-09-29

tolerances:
  rtol: 0.01
  atol: 0.01

cases:
  - name: mixed_quality_landscape
    description: "Moderate vegetation, mild water stress, intact soil, fragmented patches."
    inputs:
      metrics:
        ndvi_mean: 0.52
        ewsi_mean: 0.47
        soc_t_ha: 42.0
        shdi: 0.68
        ecsi_t_co2_ha_yr: 1.15
        slope_stability: 0.82
        connectivity: 0.5
    expected: 50.750000
    expected_key: hlhs

