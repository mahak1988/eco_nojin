# --------------------------------------------------------------
# BOUNDARY CASES - generated by scripts/boundary_cases.py
#
# The values below are not chosen by hand. Each case pins one
# parameter at the limit its own validate_inputs declares, so the
# limit and the fixture cannot drift apart.
#
# A mid-range fixture cannot see a limit defect: EPIA reported no
# water stress across most of its range while its single fixture
# sat above it, and the defect passed. These cases close that gap.
# --------------------------------------------------------------
  - name: ndvi_mean_at_minimum
    description: "metrics.ndvi_mean pinned at its minimum (0.0) as declared by validate_inputs."
    inputs:
      metrics: {"ndvi_mean": 0.0, "ewsi_mean": 0.47, "soc_t_ha": 42.0, "shdi": 0.68, "ecsi_t_co2_ha_yr": 1.15, "slope_stability": 0.82, "connectivity": 0.5}
    expected: 37.7500000000
    expected_key: hlhs
    # Derived from these guards in validate_inputs:
    #   metrics.ndvi_mean must satisfy [0.0, 1.0]
    #   guard: if not (0 <= metrics.ndvi_mean <= 1):
  - name: ndvi_mean_at_maximum
    description: "metrics.ndvi_mean pinned at its maximum (1.0) as declared by validate_inputs."
    inputs:
      metrics: {"ndvi_mean": 1.0, "ewsi_mean": 0.47, "soc_t_ha": 42.0, "shdi": 0.68, "ecsi_t_co2_ha_yr": 1.15, "slope_stability": 0.82, "connectivity": 0.5}
    expected: 57.7500000000
    expected_key: hlhs
    # Derived from these guards in validate_inputs:
    #   metrics.ndvi_mean must satisfy [0.0, 1.0]
    #   guard: if not (0 <= metrics.ndvi_mean <= 1):
  - name: ewsi_mean_at_minimum
    description: "metrics.ewsi_mean pinned at its minimum (0.0) as declared by validate_inputs."
