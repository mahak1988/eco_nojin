    expected: 60.1500000000
    expected_key: hlhs
    # Derived from these guards in validate_inputs:
    #   metrics.ewsi_mean must satisfy [0.0, 1.0]
    #   guard: if not (0 <= metrics.ewsi_mean <= 1):
  - name: ewsi_mean_at_maximum
    description: "metrics.ewsi_mean pinned at its maximum (1.0) as declared by validate_inputs."
    inputs:
      metrics: {"ndvi_mean": 0.52, "ewsi_mean": 1.0, "soc_t_ha": 42.0, "shdi": 0.68, "ecsi_t_co2_ha_yr": 1.15, "slope_stability": 0.82, "connectivity": 0.5}
