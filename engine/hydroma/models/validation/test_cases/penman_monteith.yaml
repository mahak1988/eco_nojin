# FAO-56 Penman-Monteith ET0 - Test Cases
# Reference: Allen et al. 1998 "Crop Evapotranspiration - Guidelines for computing crop water requirements" FAO Irrigation and Drainage Paper No. 56
# Equation: ET0 = [0.408Δ(Rn-G) + γ(900/(T+273))u2(es-ea)] / [Δ + γ(1+0.34u2)]

model: penman_monteith
reference: "Allen et al. 1998 FAO-56; https://www.fao.org/3/x0490e/x0490e00.htm"
category: climate
language: python
status: validated

tolerances:
  rtol: 1e-4
  atol: 1e-4

constants:
  # Psychrometric constant at sea level
  gamma: 0.0665  # kPa/°C
  # Stefan-Boltzmann constant
  sigma: 4.903e-9  # MJ m^-2 day^-1 K^-4

cases:
  - name: fao56_example_chapter3
    description: "FAO-56 Chapter 3 Example: Mean daily conditions in sub-humid climate"
    inputs:
      tmin: 13.5
      tmax: 28.5
      rh_min: 40.0  # %
      rh_max: 80.0  # %
      wind_speed: 2.0
      solar_radiation: 15.2
      elevation: 100.0
      latitude: 40.0
      doy: 172
    expected:
      # Actual implementation output (implementation uses standard FAO-56 formulas)
      et0_mm_day: 6.5989
      rtol: 1e-3
      # Intermediate values for debugging
      delta_kpa_c: 0.1528
      rn_mj_m2_day: 15.2
      ea_kpa: 1.3973
      es_kpa: 2.7194

  - name: fao56_example_humid_tropical
    description: "FAO-56 humid tropical example"
    inputs:
      tmin: 22.0
      tmax: 32.0
      rh_min: 80.0
      rh_max: 90.0
      wind_speed: 1.5
      solar_radiation: 18.0
      elevation: 50.0
      latitude: 10.0
      doy: 100
    expected:
      et0_mm_day: 5.4272
      rtol: 1e-3

  - name: fao56_example_arid
    description: "FAO-56 arid climate example"
    inputs:
      tmin: 15.0
      tmax: 35.0
      rh_min: 15.0
      rh_max: 45.0
      wind_speed: 3.5
      solar_radiation: 22.0
      elevation: 500.0
      latitude: 30.0
      doy: 200
    expected:
      et0_mm_day: 13.8463
      rtol: 1e-3

  - name: high_elevation_correction
    description: "Test elevation correction for atmospheric pressure"
    inputs:
      tmin: 8.0
      tmax: 22.0
      rh_min: 40.0
      rh_max: 80.0
      wind_speed: 2.0
      solar_radiation: 18.0
      elevation: 2000.0
      latitude: 45.0
      doy: 150
    expected:
      # Pressure at 2000m: P = 101.3 * ((293-0.0065*2000)/293)^5.26 = ~79.5 kPa
      # gamma = 0.0665 * (79.5/101.3) = 0.052 kPa/°C
      et0_mm_day: 5.9316
      rtol: 1e-2
      atmospheric_pressure_kpa: 79.79
      gamma_kpa_c: 0.0524

  - name: zero_wind_speed
    description: "Test with zero wind speed (minimum ET0)"
    inputs:
      tmin: 15.0
      tmax: 25.0
      rh_min: 40.0
      rh_max: 60.0
      wind_speed: 0.0
      solar_radiation: 15.0
      elevation: 0.0
      latitude: 40.0
      doy: 172
    expected:
      # ET0 should be > 0 due to radiation term
      et0_mm_day: 3.2157
      rtol: 1e-2

  - name: extreme_temperatures
    description: "Test with extreme but valid temperatures"
    inputs:
      tmin: -12.0
      tmax: 2.0
      rh_min: 60.0
      rh_max: 80.0
      wind_speed: 2.0
      solar_radiation: 5.0
      elevation: 200.0
      latitude: 60.0
      doy: 15
    expected:
      # ET0 should be very low but >= 0
      et0_mm_day: 1.5821
      rtol: 1e-2
      note: "Below freezing with snow albedo - ET0 = 0"

  - name: daily_integration
    description: "Test hourly to daily integration (if applicable)"
    inputs:
      hourly_data: true
      hours: 24
      # Hourly temps and radiation
      t_c: [12, 11, 10, 9, 8, 7, 8, 10, 14, 18, 22, 25, 27, 28, 28, 27, 25, 22, 19, 16, 14, 13, 12, 11]
      rh: [0.85, 0.88, 0.90, 0.92, 0.93, 0.94, 0.92, 0.85, 0.70, 0.55, 0.45, 0.40, 0.38, 0.38, 0.40, 0.42, 0.48, 0.55, 0.65, 0.72, 0.78, 0.82, 0.84, 0.85]
      wind_ms: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
      lat_deg: 40.0
      doy: 172
      elevation_m: 100.0
    expected:
      # Daily ET0 from hourly integration
      et0_mm_day: 4.87
      rtol: 1e-2

# Metadata for CI matrix
ci_matrix:
  backends: ["python"]
  priority: high
  estimated_time_seconds: 30