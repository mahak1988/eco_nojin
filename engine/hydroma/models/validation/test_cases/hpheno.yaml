# hpheno - generated from HPheno signatures
#
# GENERATED on 2026-09-29 by scripts/make_fixture.py, then given a real series
# after the model reported it needed at least 12 observations. That bound is a
# scientific constraint of the curve fit, not a validator artefact, so the
# fixture satisfies it rather than the model being relaxed.
#
# One growing season, 24 NDVI observations on a 5-day step: the seasonal
# pattern the model exists to detect. `expected` was recorded from an actual
# run, not predicted.
#
# 2026-10-01: this case did not run at all before. `dates` is a list of ISO
# strings because PyYAML has no date type, `compute` computed
# (eos_date - sos_date).days, and the subtraction of two strings raised
# TypeError. Nothing surfaced it because `hpheno` is not in
# engine/hydroma/models/validation/runner.py::_DISPATCH, so the case was
# reported `not_run` without being executed. HPheno._as_dates now accepts
# ISO-8601 strings, and this case runs.
#
# RECORDED, NOT CORRECTED: the run reports sos = None and los_days = 0.
# The SOS rule is "the first positive zero-crossing of the derivative whose
# NDVI is above the threshold", and this synthetic series is already rising at
# index 1, so there is no upward zero-crossing to find and the model reports
# no start of season. The 0.5588 recorded below is unaffected because
# expected_key is max_ndvi. The recorded value is left exactly as it was; the
# rule is the defect, and changing it is a model decision with callers behind
# it. See the report.
model: hpheno
class: HPheno
reference: "Hydroma Phenology Detection"
language: python
status: draft

tolerances:
  rtol: 0.01
  atol: 0.01

cases:
  - name: single_season
    description: "One growing season, 24 NDVI observations on a 5-day step."
    inputs:
      ndvi_ts: [0.2, 0.249, 0.2971, 0.3434, 0.3871, 0.4272, 0.4631, 0.4941, 0.5196, 0.5392, 0.5525, 0.5592, 0.5592, 0.5525, 0.5392, 0.5196, 0.4941, 0.4631, 0.4272, 0.3871, 0.3434, 0.2971, 0.249, 0.2]
      dates: ["2026-03-01", "2026-03-06", "2026-03-11", "2026-03-16", "2026-03-21", "2026-03-26", "2026-03-31", "2026-04-05", "2026-04-10", "2026-04-15", "2026-04-20", "2026-04-25", "2026-04-30", "2026-05-05", "2026-05-10", "2026-05-15", "2026-05-20", "2026-05-25", "2026-05-30", "2026-06-04", "2026-06-09", "2026-06-14", "2026-06-19", "2026-06-24"]
