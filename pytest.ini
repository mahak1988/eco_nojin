[pytest]
filterwarnings =
    ignore:datetime\.datetime\.utcnow:DeprecationWarning
    ignore::DeprecationWarning:numpy\._core\.fromnumeric
    ignore::DeprecationWarning:sqlalchemy\.sql\.schema
    ignore::DeprecationWarning:services\.land\.land_profile
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Every test directory, so a bare `pytest` runs exactly what CI runs. It used
# to list only `tests/unit`, which silently skipped the whole tests/integration,
# tests/contract and tests/benchmarks trees (~500 tests) and every test_*.py at
# the tests/ root. CI ran those suites in separate jobs, so the gap was invisible
# locally and very visible to whoever ran the command by hand.
testpaths = services engine testing_lab tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    requires_cpp: needs the compiled C++ core (engine/cpp_core). Skipped, never failed, when the extension is absent.
    network: makes a live outbound network call. Excluded from the default lane.
    slow: exceeds 10 seconds.