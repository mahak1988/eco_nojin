# Heavy RAG / AI Tests — separate shard for CI
# Run with: pytest -c pytest-heavy.ini -n 1 --timeout=300

[tool.pytest.ini_options]
testpaths = ["services/ai/tests", "services/knowledge/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

# Single worker to avoid OOM with torch/sentence-transformers
addopts = "-n 1 -p no:cacheprovider"

# Ensure async tests work
[pytest]
asyncio_mode = auto