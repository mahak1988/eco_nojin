services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eco_nojin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eco_nojin
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"