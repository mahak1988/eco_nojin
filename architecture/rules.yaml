architecture_rules:
  - rule_id: "AR-01"
    rule: "engine نباید به services وابسته باشد"
    penalty: "FAIL CI"
    current_enforcement: "ENGINE_NO_SERVICES"
    v3_constitution: "AR-01"
  - rule_id: "AR-02"
    rule: "engine نباید مستقیماً به DB implementation وابسته باشد"
    penalty: "FAIL CI"
    current_enforcement: "ENGINE_NO_DATABASE"
    v3_constitution: "AR-02"
  - rule_id: "AR-03"
    rule: "هسته علمی نباید به HTTP framework وابسته باشد"
    penalty: "FAIL CI"
    current_enforcement: "NONE — not enforced"
    v3_constitution: "AR-01"
  - rule_id: "AR-04"
    rule: "هسته علمی نباید به auth/payment/blockchain وابسته باشد"
    penalty: "FAIL CI"
    current_enforcement: "PARTIAL — ENGINE_NO_AUTH + ENGINE_NO_PAYMENT + ENGINE_NO_BLOCKCHAIN cover auth/payment/blockchain; ENGINE_NO_FRONTEND additionally present (backend-only)"
    v3_constitution: "AR-11"
  - rule_id: "AR-05"
    rule: "سرویس‌ها نباید مل علمی را خارج از Gateway فراخوانی کنند"
    penalty: "FAIL CI"
    current_enforcement: "SERVICES_NO_ENGINE_INTERNALS"
    v3_constitution: "AR-12"
  - rule_id: "AR-06"
    rule: "همه مسیرهای مدل باید از Gateway عبور کنند"
    penalty: "FAIL CI"
    current_enforcement: "SERVICES_NO_ENGINE_INTERNALS"
    v3_constitution: "AR-13"
  - rule_id: "AR-07"
    rule: "AI نباید معادلات یا پارامترهای علمی را تغییر دهد"
    penalty: "FAIL CI + Audit"
    current_enforcement: "AI_NO_ENGINE_INTERNALS"
    v3_constitution: "AR-07"
  - rule_id: "AR-08"
    rule: "Daneshyar نباید تعارض علمی را پنهان کند"
    penalty: "FAIL CI + Audit"
    current_enforcement: "NONE — not enforced"
    v3_constitution: "AR-05"
  - rule_id: "AR-09"
    rule: "Tasmimyar نباید بدون اهداف و قیود توصیه قطعی بدهد"
    penalty: "FAIL CI"
    current_enforcement: "NONE — not enforced"
    v3_constitution: "AR-05"
  - rule_id: "AR-10"
    rule: "هیچ سرویس نباید نتیجه یک مدل را به عنوان مدل دیگر معرفی کند"
    penalty: "FAIL CI"
    current_enforcement: "NONE — not enforced"
    v3_constitution: "AR-09"
  - rule_id: "AR-11"
    rule: "هیچ frontend/auth/payment/blockchain در هستهٔ علمی (حفظ‌شده از سند قبلی)"
    penalty: "FAIL CI"
    current_enforcement: "ENGINE_NO_AUTH/PAYMENT/BLOCKCHAIN"
    v3_constitution: "AR-11"
  - rule_id: "AR-12"
    rule: "سرویس‌ها حق فراخوانی مستقیم درون موتور را ندارند"
    penalty: "FAIL CI"
    current_enforcement: "SERVICES_NO_ENGINE_INTERNALS"
    v3_constitution: "AR-12"
  - rule_id: "AR-13"
    rule: "تمام فراخوانی مدل از Gateway"
    penalty: "FAIL CI"
    current_enforcement: "SERVICES_NO_ENGINE_INTERNALS — Gateway-only model calls"
    v3_constitution: "AR-13"

enforcement_tool:
  name: "tools/detect_imports.py"
  mode: "AST static import guard"
  policy_file: "tools/import_guard_policy.json"
  ci_connected: false
  negative_tests_per_rule: 0
  spec_requirement: ">=3 negative tests per rule, run in CI (spec §3.3)"
