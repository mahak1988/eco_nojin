meta:
  title: "Eco Nojin / HyDroMA - Target Architecture Map to Current Repo"
  spec_source: "docs/specs/ECO-NOJIN MASTER EXECUTION SPECIFICATION.md"
  layer_count: 11
  layer_count_note: "Spec section 3.1 chain drawn as 11 boxes. The combined diagram notation 'Application Services <--- AI Interpreter' is split into two boxes (#2 Application Services, #3 AI Interpreter - interpretation-only); 'Persistence Port <--- SQLite/GeoPackage' is one box (#11) with SQLite/GeoPackage as its internal backing."
  status_vocabulary: ["IMPLEMENTED", "PARTIAL", "SKELETON", "MISSING"]

layers:
  - name: "User / Product / Application"
    spec_reference: "§3.1"
    current_repo_path: "services/api_gateway/"
    status: "PARTIAL"
    evidence: "Topmost real runtime artifact is the HTTP API surface (services/api_gateway/__init__.py plus routers/ and api/v1/). No dedicated web/UI product frontend exists in the repo."
  - name: "Application Services"
    spec_reference: "§3.1"
    current_repo_path: "services/"
    status: "IMPLEMENTED"
    evidence: "Broad service layer (services/__init__.py; subpackages carbon, mrv, tourism, marketplace, notification, telegram_bot, workflow, auth, contracts, validation, audit, territory, etc.)."
  - name: "AI Interpreter (interpretation only)"
    spec_reference: "§3.1"
    current_repo_path: "services/ai/"
    status: "PARTIAL"
    evidence: "services/ai/ interpretation services: llm_router.py, rag.py, hydroma_rag.py, unified_rag.py, nlg.py, embedding_service.py, support_agent.py, admin_assistant.py. AI isolation enforced by AI_NO_ENGINE_INTERNALS (see rules.yaml)."
  - name: "Decision Engine (Tasmimyar)"
    spec_reference: "§3.1"
    current_repo_path: "engine/tasmimyar/__init__.py"
    status: "PARTIAL"
    evidence: "Weighted-criteria DecisionEngine with hardcoded default weights 0.3/0.4/0.3 at engine/tasmimyar/__init__.py:144-163; decisions held in an in-memory dict at :143. AR-09 bounded recommendation (objectives/constraints) not evidenced."
  - name: "Knowledge & Evidence (Daneshyar)"
    spec_reference: "§3.1"
    current_repo_path: "engine/knowledge/__init__.py + engine/evidence/__init__.py"
    status: "SKELETON"
    evidence: "In-memory only. KnowledgeEngine._facts/_claims/_rules dicts at engine/knowledge/__init__.py:130-132; Evidence store at engine/evidence/__init__.py:129-132. No durable backing or schema."
  - name: "Scenario Engine"
    spec_reference: "§3.1"
    current_repo_path: "engine/hydroma/scenario/__init__.py"
    status: "SKELETON"
    evidence: "engine/hydroma/scenario/__init__.py:1 is a 1-line docstring stub (empty). Capability partially lives in the sibling package engine/hydroma/scenarios/ (scenario_manager.py, whatif_engine.py, monte_carlo.py, climate_scenarios.py, crop_scenarios.py)."
  - name: "Engine Gateway"
    spec_reference: "§3.1"
    current_repo_path: "engine/gateway/__init__.py"
    status: "IMPLEMENTED"
    evidence: "class EngineGateway at engine/gateway/__init__.py:504; 1878 lines; typed contracts GatewayRequest:124, GatewayResult:139, ModelSpec:92, InputSpec:105, UnitSpec:54, ProvenanceSpec:62, UncertaintySpec:71; static dispatch surface (25 method defs)."
  - name: "Model Registry + Scientific Model Cards"
    spec_reference: "§3.1"
    current_repo_path: "engine/models/registry.py + engine/models/cards/"
    status: "IMPLEMENTED"
    evidence: "Code-driven registry engine/models/registry.py (1654 lines); cards are 37 Markdown files under engine/models/cards/ (22 CANON-*, 14 S-*, 1 _template.md; 0 YAML). Deviation: spec 8.2 envisions structured/YAML model cards - current cards are Markdown, not machine-readable YAML."
  - name: "Hydroma Engine"
    spec_reference: "§3.1"
    current_repo_path: "engine/hydroma/"
    status: "IMPLEMENTED"
    evidence: "Large scientific module tree: engine/hydroma/{climate, soil, groundwater, irrigation, watershed, carbon, crop, water, biofertilizer, formulas, models, decision_support, economics, land, optimization}."
  - name: "Numerical & Scientific Kernels"
    spec_reference: "§3.1"
    current_repo_path: "engine/cpp_core/ + engine/hydroma/cpp_bridge/"
    status: "PARTIAL"
    evidence: "Compiled binaries present: engine/hydroma/cpp_bridge/hydroma_core.cp312-win_amd64.pyd and hydroma_core.cp311-win_amd64.pyd, with pure-Python fallbacks (*_fast.py/*_fallback.py). engine/cpp_core/ C++ sources cannot be rebuilt (no compiler in env); engine/README.md:28 marks cpp_core/ 'Orphaned ... not connected to the main Python application'."
  - name: "Persistence Port <- SQLite/GeoPackage (internal)"
    spec_reference: "§3.1 / §4.5"
    current_repo_path: "engine/ports/persistence.py"
    status: "PARTIAL"
    evidence: "PersistencePort is a typing.Protocol (engine/ports/persistence.py:46), not spec 4.5's ABC. Surface = DB connections (get_duckdb/get_sqlite/get_duckdb_pooled) plus domain methods save_evidence/save_fact/save_decision/load_*/list_evidence (:60-109) - differs from 4.5's save_dataset/save_model_run/save_claim/link_evidence_to_claim/save_scenario. Only in-engine impls exist (engine/ports/persistence_impl.py: InMemoryPersistence:34, FileBackedPersistence:116); spec's adapters/persistence/sqlite_persistence.py (SQLitePersistence) is MISSING - no SQLite adapter anywhere; DB reach is only the sanctioned bridge (database.config/database.base)."

forbidden_in_core:
  spec_reference: "§2.2 (الف forbidden / ب approved FOSS stack) - ZED"
  note: "Zero-External-Dependency: scientific core must not depend on anything outside the repo and the standard Python environment."
  forbidden_categories:
    - category: "Language / Runtime"
      forbidden: "MATLAB, Mathematica, R (mandatory), Julia (mandatory)"
      reason: "external dependency"
    - category: "Commercial GIS"
      forbidden: "ArcGIS, ArcPy, ERDAS, ENVI"
      reason: "license"
    - category: "Server Database"
      forbidden: "PostgreSQL (mandatory), MongoDB, Redis, Oracle"
      reason: "separate install required"
    - category: "Cloud APIs"
      forbidden: "OpenAI API, Claude API, Google Earth Engine (mandatory), AWS S3 (mandatory)"
      reason: "requires key and internet"
    - category: "Commercial Software"
      forbidden: "MS Excel (as engine), Tableau, PowerBI"
      reason: "license"
    - category: "Commercial Compiler"
      forbidden: "Intel Compiler, MSVC Enterprise"
      reason: "license"
    - category: "SaaS Services"
      forbidden: "AnyDesk, Dropbox, Google Drive (as dependency)"
      reason: "network dependency"
  approved_stack_zed:
    - layer: "Language"
      tool: "Python 3.11+"
      license: "PSF"
      usage: "mandatory"
    - layer: "Compute"
      tool: "NumPy, SciPy, pandas"
      license: "BSD"
      usage: "mandatory"
    - layer: "GIS"
      tool: "rasterio, geopandas, shapely, pyproj"
      license: "BSD"
      usage: "optional (pure-Python fallback)"
    - layer: "Data"
      tool: "sqlite3 (stdlib)"
      license: "n/a"
      usage: "mandatory"
    - layer: "ORM/DB"
      tool: "SQLAlchemy 2.x"
      license: "MIT"
      usage: "optional"
    - layer: "GIS DB"
      tool: "SpatiaLite (SQLite ext)"
      license: "LGPL"
      usage: "optional"
    - layer: "Test"
      tool: "pytest, hypothesis"
      license: "MIT"
      usage: "development"
    - layer: "C++ Build"
      tool: "GCC/Clang, CMake, pybind11"
      license: "GPL/BSD"
      usage: "optional"
    - layer: "ML"
      tool: "scikit-learn"
      license: "BSD"
      usage: "optional"
    - layer: "Speed"
      tool: "numba"
      license: "BSD"
      usage: "optional"
    - layer: "Reporting"
      tool: "Matplotlib"
      license: "PSF-based"
      usage: "optional"
    - layer: "Units"
