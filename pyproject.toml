[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econojin"
version = "0.2.0"
description = "Integrated Sustainable Agriculture Platform - Global Digital Twin"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Eco Nojin Team" }]
keywords = ["agriculture", "digital-twin", "gis", "hydrology", "sustainability"]

# === CORE DEPENDENCIES ===
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.32,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "numpy>=2.3,<2.4",
    "pandas>=2.3,<3.0",
    "httpx>=0.28,<1.0",
    "requests>=2.34,<3.0",
    "aiogram>=3.30,<4.0",
    "structlog>=26.0,<27.0",
]

[project.optional-dependencies]
# لایه مکانی و سنجش از دور (Geospatial & Remote Sensing)
geo = [
    "geopandas>=0.14,<2.0",
    "rasterio>=1.3,<2.0",
    "rioxarray>=0.15,<1.0",
    "xarray>=2024.3,<2025.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.6,<4.0",
    "fiona>=1.9,<2.0",
    "pystac-client>=0.8,<1.0",
    "planetary-computer>=1.0,<2.0",
    "osmnx>=1.9,<2.0",
    "netCDF4>=1.6,<2.0",
    "h5py>=3.10,<4.0",
    "zarr>=2.17,<3.0",
    "tifffile>=2026.8.23,<2027.0", # اضافه شده برای پردازش تصاویر ماهواره‌ای
]

# لایه مدل‌سازی هیدرولوژی (Hydrological Modeling)
hydro = [
    "aquacrop>=3.1,<4.0",
    "pyfao56>=1.4,<2.0",
    "landlab>=2.11,<3.0",
    "pywr>=1.31,<2.0",
]

# لایه هوش مصنوعی و یادگیری ماشین (Machine Learning)
ml = [
    "scikit-learn>=1.5,<2.0", # ارتقا یافته برای سازگاری با NumPy 2.x
    "scipy>=1.14,<2.0",       # ارتقا یافته برای سازگاری با NumPy 2.x
    "numba>=0.62,<1.0",       # ارتقا یافته برای پشتیبانی از NumPy 2.3
    "transformers>=4.40,<5.0",
    "sentence-transformers>=2.7,<4.0",
    "joblib>=1.3,<2.0",
]

# لایه بهینه‌سازی و تحقیق در عملیات (Optimization & OR)
optimize = [
    "cvxpy>=1.4,<2.0",
    "pyomo>=6.7,<7.0",
    "PuLP>=2.8,<3.0",
    "highspy>=1.5,<2.0",
    "sparsediffpy>=0.6.1,<1.0", # اضافه شده برای مشتق‌گیری خودکار در بهینه‌سازی
]

# لایه بلاکچین (Web3 & Smart Contracts)
web3 = [
    "web3>=6.15,<8.0",
    "eth-account>=0.11,<1.0",
]

# لایه بصری‌سازی (Visualization - Heavy, Dev Only)
viz = [
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "pyvista>=0.43,<1.0",
    "vtk>=9.3,<10.0",
]

# لایه کلان‌داده (Big Data Processing)
bigdata = [
    "polars>=0.20,<2.0",
    "dask[complete]>=2024.3,<2025.0",
    "duckdb>=0.10,<2.0",
]

# ابزارهای توسعه و تست (Development & Testing Tools)
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.8,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "vulture>=2.11,<3.0",
    # Required to build engine/cpp_core (hydroma_core pybind11 module).
    # CMakeLists.txt and the c_api bindings both need the pybind11 headers;
    # without this the native module cannot be compiled from a clean checkout.
    "pybind11>=2.10",
]

# نصب کامل برای محیط توسعه محلی (Local Dev Environment)
all = [
    "econojin[geo,hydro,ml,optimize,web3,viz,bigdata,dev]"
]

[project.urls]
Homepage = "https://econojin.io"
Repository = "https://github.com/econojin/econojin"

[project.scripts]
econojin = "services.api_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "database*", "services*", "contracts*", "shared*"]
exclude = ["tests*", "docs*", "backups*", "build*"]

[tool.setuptools.package-data]
# .csv is load-bearing: engine/hydroma/soil/parameters.py reads
# engine/data/soil_vg_table.csv at import, so a wheel built without it fails to
# import the soil package at all.
"*" = ["*.yaml", "*.yml", "*.json", "*.sql", "*.md", "*.csv"]

# === RUFF CONFIGURATION ===
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = [
    ".git", ".venv", "venv", "__pycache__", "build", "dist",
    "backups", "migrations", "engine/cpp_core/build2",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "PTH"]
# RUF001/RUF002/RUF003 report characters that are visually confusable with ASCII.
# In this repository Persian and Arabic letters ARE the payload: the UI, the API
# messages, the docstrings and the test fixtures are all in Persian, and the
# engine returns Persian strings to callers. Selecting the whole RUF family
# therefore flagged 2716 findings that are not defects -- `ه` reported as a
# mistaken `o`, `ا` as a mistaken `l`, and `۱` as a mistaken `I`.
#
# They are ignored globally rather than exempted file by file, because a
# per-file list cannot be maintained: 2147 of the findings are spread over
# hundreds of files, and every new Persian string would add another. The rules
# that matter in this codebase are RUF010, RUF015 and RUF100, and they stay on.
ignore = [
    # pre-existing
    "E501", "B008", "C901", "PLR0913", "PLR0912",
    # Persian and Arabic letters ARE the payload: the UI, the API messages, the
    # docstrings and the fixtures are all in Persian, and the engine returns
    # Persian strings to callers. Flagging them as Latin homoglyph typos produced
    # 2716 findings that are not defects -- `ه` as `o`, `ا` as `l`, `۱` as `I`.
    # A per-file exemption cannot be maintained: 2147 of them were spread over
    # hundreds of files and every new Persian string added another.
    "RUF001", "RUF002", "RUF003",
    # E402, 498 findings, attributed by walking each file's AST: 296 are a
    # `logger = get_logger()` line between imports, 103 a docstring placed after
    # the first import, 43 a `get_db()` definition, 30 a deliberate
    # `load_dotenv()`, 10 a `router = APIRouter(...)`. None has a runtime
    # effect. The 53 that do mutate `sys.path` are a packaging defect and belong
    # in a `pip install -e .` fix, not in 53 import-block edits.
    "E402",
    # os.path and open() preference, 343 findings, zero correctness impact.
    # 282 of them are in throwaway one-off helpers under scripts/print/.
    "PTH100", "PTH103", "PTH107", "PTH108", "PTH110", "PTH112", "PTH113",
    "PTH117", "PTH118", "PTH119", "PTH120", "PTH122", "PTH123", "PTH202",
    "PTH207", "PTH208",
    # `l` as a variable name, 33 findings. Genuinely unreadable, and genuinely
    # not worth gating a merge on.
    "E741",
    # Two findings, both a style preference declined on purpose and documented
    # at the top of the module itself:
    #   et_calculator.py:220  SIM108 -- the else branch carries the comment that
    #     a polar night reads as a clear sky, which is WHY the value is 1.0
    #   salinity.py:107       SIM116 -- five multi-line records with ec-dependent
    #     content; a dict literal would move the conditionals into lambdas
    "SIM108", "SIM116",
]

# Deliberately NOT ignored, because each is a real defect class:
#   B904  130  `raise X` inside `except` without `from` loses the chained traceback
#   RUF012 63  mutable class default shared across instances (verified: 0 are pydantic)
#   SIM115 47  file handle opened without a context manager
#   PT011  44  pytest.raises(ValueError) too broad -- a validation error from a
#                 missing field passes for the wrong reason
#   F601/F823/B023/RUF006  13  duplicate dict keys, name used before assignment,
#                 loop-variable closure, dangling task
# B019, which is a lint loop rather than a bug.

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["PLR2004", "S101"]
# The strict engine suite asserts the *category* of failure it is hunting, not a
# message. A tripwire that pins "ValueError" is checking that the engine rejects
# the input at all; pinning the wording would make the test fail on a message
# change while the defect it guards is still open. Where the message IS the
# contract, the test passes match= itself.
"engine/strict_tests/*" = ["PLR2004", "S101", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "database", "services", "contracts", "shared"]
combine-as-imports = true

# === MYPY CONFIGURATION ===
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
]

[[tool.mypy.overrides]]
module = [
    "numpy.*", "scipy.*", "pandas.*", "sqlalchemy.*", "sklearn.*",
    "rasterio.*", "fiona.*", "osgeo.*", "geopandas.*", "xarray.*",
    "pyproj.*", "shapely.*", "pystac.*", "planetary_computer.*",
    "dask.*", "zarr.*", "netCDF4.*", "h5py.*", "numba.*", "duckdb.*",
    "aiogram.*", "aiohttp.*", "web3.*", "eth_account.*",
    "tifffile.*", "sparsediffpy.*",
    "arabic_reshaper", "bidi.algorithm",
    "twilio.rest", "hydroma_core",
    "psutil", "pymoo.*", "pywr.*", "pyRothC.*", "pySWATPlus.*",
    "aquacrop.*",
    "dns.*",
]
ignore_missing_imports = true

# === PYTEST & COVERAGE CONFIGURATION ===
[tool.coverage.run]
source = ["services", "engine", "contracts"]
omit = ["tests/*", "*/migrations/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
  # Ratchet, not a target. The engine measured 37.56% under engine/strict_tests
  # alone and 37.6% with the nested engine suites added, so 80% was never in
  # effect -- it was asserted in AGENTS.md and implemented nowhere. Starting the
  # floor just under the measured value keeps the gate honest on day one and
  # makes any drop fail. Raise it as coverage genuinely improves; never lower it
  # to make a build pass.
  #
  # Enforced by tests/contract/test_g3_g4_coverage_and_deadcode.py, which
  # asserts the value is a rung on the ladder {36, 60, 70, 80} and that it is
  # never lower than the recorded baseline.
  fail_under = 36

# === MUTMUT CONFIGURATION ===
[tool.mutmut]
paths_to_mutate = ["engine", "services"]
backup = false
runner = "pytest -x"
tests_dir = "tests"
timeout_factor = 2.0
hash_of_tests = true