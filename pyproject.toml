[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econojin"
version = "0.1.0"
description = "Integrated Sustainable Agriculture Platform - Global Digital Twin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Eco Nojin Team" }]
keywords = ["agriculture", "digital-twin", "gis", "hydrology", "sustainability"]

# === CORE DEPENDENCIES ===
# Synced with requirements.txt (2026-08-18)
dependencies = [
    # Core API
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.2,<2.0",
    "python-multipart>=0.0.32,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",

    # Scientific stack
    "numpy>=2.4,<3.0",
    "numba>=0.67,<1.0",
    "pandas>=3.0,<4.0",
    "scipy>=1.17,<2.0",
    "scikit-learn>=1.5,<2.0",

    # GIS & Remote Sensing
    "geopandas>=1.0,<2.0",
    "rasterio>=1.3.10,<1.4",
    "rioxarray>=0.15,<1.0",
    "xarray>=2024.7,<2025.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.6,<4.0",
    "fiona>=1.9,<2.0",
    "pystac-client>=0.8,<1.0",
    "planetary-computer>=1.0,<2.0",
    "osmnx>=1.9,<2.0",

    # Big Data
    "dask[complete]>=2024.8,<2025.0",
    "zarr>=2.18,<3.0",
    "netCDF4>=1.7,<2.0",
    "h5py>=3.11,<4.0",
    "duckdb>=1.0,<2.0",

    # HTTP
    "requests>=2.34,<3.0",
    "httpx>=0.28,<1.0",

    # Bots
    "aiogram>=3.30,<4",
    "aiohttp==3.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-timeout>=2.4,<3.0",
    "ruff>=0.2,<1.0",
    "mypy>=1.8,<2.0",
    "radon>=6.0,<7.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
]

all = ["econojin[dev]"]

[project.urls]
Homepage = "https://econojin.io"
Repository = "https://github.com/econojin/econojin"

[project.scripts]
econojin = "services.api_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "database*", "services*", "contracts*", "shared*"]
exclude = ["tests*", "docs*", "backups*", "build*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.sql", "*.md"]

# === RUFF ===
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
    ".git", ".venv", "venv", "__pycache__", "build", "dist",
    "backups", "migrations", "engine/cpp_core/build2",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "PTH"]
ignore = ["E501", "B008", "C901", "PLR0913", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "database", "services", "contracts", "shared"]
combine-as-imports = true

# === MYPY ===
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy", "sqlmypy"]

[[tool.mypy.overrides]]
module = [
    "numpy.*", "scipy.*", "pandas.*", "sqlalchemy.*", "sklearn.*",
    "rasterio.*", "fiona.*", "osgeo.*", "geopandas.*", "xarray.*",
    "pyproj.*", "shapely.*", "pystac.*", "planetary_computer.*",
    "dask.*", "zarr.*", "netCDF4.*", "h5py.*", "numba.*", "duckdb.*",
    "aiogram.*", "aiohttp.*",
]
ignore_missing_imports = true

# === PYTEST ===
[tool.coverage.run]
source = ["services", "engine", "contracts"]
omit = ["tests/*", "*/migrations/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true