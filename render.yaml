# Render free-tier blueprint for Eco Nojin API (Phase 8-C free deploy)
services:
  - type: web
    name: eco-nojin-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.api_gateway.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: AI_LLM_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false