implementation_note: "Implemented in engine/hydroma/water_balance.py as a mass-conserving bucket for P = ET + Q + dS (mm per period); storage clamped at >= 0 with the clamped demand reported per period in excess_mm. Verified 2026-10-10 in engine/tests/test_water_balance.py: mass closure on a deterministic series is 7.1e-15 mm, the storage clamp reports the exact overflow instead of silently dropping water, and zero fluxes give zero storage change. This is a definitional identity (conservation of water), so the applicable verification is closure and unit consistency, which pass; an external catchment benchmark is still tracked as a separate gap."
