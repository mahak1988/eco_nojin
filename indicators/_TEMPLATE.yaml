# indicators/_TEMPLATE.yaml — the indicator card contract (v3.1 §6.2 / §8.2)
#
# PRECONDITION (SB-06 / AR-03): no novel index may be implemented or
# registered without a published definition + an independent reference anchor
# (the FAO-56 Example 18 pattern). tools/novel_index_gate.py enforces this over
# indicators/*.yaml and reports any card whose `reference` is tautological
# ("methodology", "project composite", "none", the project's own name, empty),
# whose evidence cannot be classified from the vocabulary in
# engine/honesty/statuses.py, or that claims VALIDATED_EXTERNAL without a
# published reference, as BLOCKED_NO_PUBLISHED_DEFINITION.
#
# This file is a TEMPLATE, not a live indicator: files whose name begins with
# "_" (and any file without a real indicator_id) are exempt from the gate.
# Copy it, fill every field, and only then wire the card to code.

indicator_id: ""                # required: e.g. "ENO_FDII_001" — a real id makes this card live
name:
  en: ""
  fa: ""
domain: ""                      # climate | hydrology | agriculture | socio_economic | composite
formula: ""                     # the published equation, verbatim
unit: ""                        # SI unit of the index value
input_variables: []             # list of {name, unit, required, default?}
reference:
  source: ""                    # independent, published citation — never the project itself
  url: ""
validation_status: ""           # e.g. REFERENCE_DATA_REQUIRED / VALIDATED_METHOD_CONFORMANCE
evidence_class: ""              # one of engine/honesty/statuses.py VOCABULARY:
                                # VALIDATED_EXTERNAL | VALIDATED_METHOD_CONFORMANCE
                                # REGRESSION_ANCHOR_STABLE | PARTIAL | UNVALIDATED | BLOCKED
maturity_target: ""             # e.g. S3
zed_compliant: false            # true only when the card declares its open-data licence (§6.3)
implementation_note: ""         # where it is implemented, what is verified, what gap remains
version: ""
